<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pizzeria Pecahan</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff4dc;--card:#fff8e6;--ink:#3b2a1a;--pri:#e8452c;--pri2:#c23420;--ok:#2fa84f;--bad:#d93a3a;--gold:#ffb81c;--soft:#ffe7b3;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#2b1d12;--card:#3d2b1c;--ink:#fff1d6;--soft:#4f3924}}
:root[data-theme="dark"]{--bg:#2b1d12;--card:#3d2b1c;--ink:#fff1d6;--soft:#4f3924}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font-family:'Fredoka','Trebuchet MS',sans-serif;display:flex;justify-content:center;align-items:center;background-size:cover;background-position:center}
#app{width:100%;max-width:1100px;padding:14px;display:flex;flex-direction:column;gap:12px}
.card{background:var(--card);border-radius:22px;padding:18px;border:4px solid #b9702d;box-shadow:0 7px 0 #8a4b1f,0 14px 26px rgba(60,20,0,.3);text-align:center}
h1{font-size:2rem;margin:6px 0;color:var(--pri)}h2{margin:4px 0;font-size:1.3rem}p{margin:6px 0;font-size:1.05rem}
.btn{font-family:inherit;font-size:1.15rem;font-weight:700;border:0;border-radius:16px;padding:12px 20px;background:var(--pri);color:#fff;box-shadow:0 5px 0 var(--pri2);cursor:pointer;min-height:48px}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--pri2)}.btn.alt{background:var(--gold);color:#3b2a1a;box-shadow:0 5px 0 #d99a00}
.btn:disabled{opacity:.4}
input[type=text]{font-family:inherit;font-size:1.1rem;padding:12px;border-radius:14px;border:3px solid var(--soft);width:100%;text-align:center;background:var(--card);color:var(--ink)}
.top{display:flex;justify-content:space-between;align-items:center;font-weight:700;background:linear-gradient(#c47a35,#94521f);color:#fff7e0;text-shadow:0 2px 0 rgba(0,0,0,.35);border:3px solid #6b3813;border-radius:16px;padding:8px 16px;box-shadow:0 4px 0 #6b3813}
.mas{width:140px;height:140px;object-fit:contain}.emo{font-size:84px;line-height:1}
.bubble{background:var(--soft);border-radius:16px;padding:10px 14px;font-size:1.05rem;text-align:left}
.row{display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.opt{font-family:inherit;background:var(--card);color:var(--ink);border:4px solid var(--soft);border-radius:18px;padding:10px;cursor:pointer;min-height:84px}
.opt:hover{border-color:var(--gold)}.opt.ok{border-color:var(--ok);background:#d8f5de;color:#1b5e2e}.opt.no{border-color:var(--bad);background:#fbdada;color:#7a1f1f}
.fr{display:inline-flex;flex-direction:column;align-items:center;font-weight:700;font-size:2rem;line-height:1.1}.fr i{display:block;width:100%;height:4px;background:currentColor;border-radius:2px;margin:2px 0}
.lvl{display:flex;align-items:center;gap:12px;text-align:left;width:100%;font-family:inherit;border:0;background:var(--card);color:var(--ink);border-radius:20px;padding:14px;box-shadow:0 5px 0 rgba(0,0,0,.12);cursor:pointer}
.lvl .n{background:var(--pri);color:#fff;width:48px;height:48px;border-radius:50%;display:grid;place-items:center;font-size:1.4rem;font-weight:700;flex:none}
.lvl.lock{opacity:.5;cursor:not-allowed}.stars{color:var(--gold);font-size:1.4rem;letter-spacing:2px}
.bar{display:flex;border:3px solid var(--ink);border-radius:10px;overflow:hidden;height:34px;width:100%}.bar span{flex:1;border-right:2px solid var(--ink)}.bar span:last-child{border:0}
.bar span.f{background:var(--gold)}
.fb{padding:12px;border-radius:14px;font-weight:600;text-align:left}.fb.ok{background:#d8f5de;color:#1b5e2e}.fb.no{background:#fbdada;color:#7a1f1f}
svg path,svg circle{transition:fill .15s}.sl{cursor:pointer}
.split{display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:center}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.card.wide{max-width:640px;margin:0 auto;width:100%}@media(max-width:700px){.split,.grid3{grid-template-columns:1fr}}
.stage{display:grid;grid-template-columns:210px 1fr;gap:18px;align-items:center}.main{display:flex;flex-direction:column;gap:12px}.side{text-align:center}
.mas.big{width:200px;height:200px;filter:drop-shadow(0 8px 6px rgba(60,20,0,.3))}.logo{width:min(440px,92%);height:auto}.float{animation:fl 3s ease-in-out infinite}.jump{animation:jp .5s}
@keyframes fl{50%{transform:translateY(-10px)}}@keyframes jp{30%{transform:translateY(-24px) scale(1.06)}}
.prog{height:12px;background:rgba(0,0,0,.25);border-radius:8px;overflow:hidden;margin-top:-4px}.prog b{display:block;height:100%;background:var(--gold);transition:width .4s}
.btn.big{font-size:1.4rem;padding:14px 34px}.bubble{margin-top:8px;text-align:center;font-weight:600;border:3px solid #b9702d;background:var(--card)}
@media(max-width:700px){.stage{grid-template-columns:1fr}.mas.big{width:110px;height:110px}}@media(prefers-reduced-motion:reduce){.float,.jump{animation:none}}
.small{font-size:.85rem;opacity:.8}details{text-align:left;font-size:.95rem}
</style></head><body>

const EMO={happy:'🧑‍🍳',sad:'😿',logo:'🍕'};

const $=s=>document.querySelector(s),app=$('#app');
const S={name:'',lvl:0,q:0,lives:3,wrong:0,score:0,prog:{}},TOTAL=5;
try{const p=localStorage.getItem('pp');if(p)S.prog=JSON.parse(p)}catch(e){}
const save=()=>{try{localStorage.setItem('pp',JSON.stringify(S.prog))}catch(e){}};
const R=a=>a[Math.floor(Math.random()*a.length)];
const sh=a=>a.map(x=>[Math.random(),x]).sort((x,y)=>x[0]-y[0]).map(x=>x[1]);
const fr=(k,n)=>`<span class="fr">${k}<i></i>${n}</span>`;
const LV=[
 {t:'Kenali Pecahan',d:'Lihat pizza, tebak pecahannya',tip:'Pembilang = irisan yang diwarnai. Penyebut = jumlah seluruh irisan.'},
 {t:'Warnai Pizza',d:'Ketuk irisan sesuai pecahan',tip:'Penyebut menunjukkan jumlah irisan, pembilang menunjukkan irisan yang diambil.'},
 {t:'Bandingkan Pecahan',d:'Mana yang lebih besar?',tip:'Penyebut sama: pembilang lebih besar = lebih besar. Pembilang sama: penyebut lebih kecil = lebih besar.'}];
function pizza(n,fill,click){
 const c=100,r=90;let s=`<svg viewBox="0 0 200 200" width="250" height="250"><circle cx="100" cy="100" r="96" fill="#c98a3b"/>`;
 for(let i=0;i<n;i++){const f=fill.includes(i),col=f?'#ffb81c':'#fff1cf';
  const a0=i*2*Math.PI/n-Math.PI/2,a1=(i+1)*2*Math.PI/n-Math.PI/2;
  const d=n==1?'':`M${c} ${c}L${c+r*Math.cos(a0)} ${c+r*Math.sin(a0)}A${r} ${r} 0 ${1/n>.5?1:0} 1 ${c+r*Math.cos(a1)} ${c+r*Math.sin(a1)}Z`;
  s+=n==1?`<circle cx="100" cy="100" r="90" fill="${col}" stroke="#a0522d" stroke-width="3"/>`:`<path class="sl" ${click?`data-i="${i}"`:''} d="${d}" fill="${col}" stroke="#a0522d" stroke-width="3"/>`;
  if(f){const m=(a0+a1)/2;s+=`<circle cx="${c+55*Math.cos(m)}" cy="${c+55*Math.sin(m)}" r="7" fill="#d93a3a" pointer-events="none"/>`}}
 return s+'</svg>'}
const bar=(k,n)=>`<div class="bar">${Array.from({length:n},(_,i)=>`<span class="${i<k?'f':''}"></span>`).join('')}</div>`;
const hud=()=>`<div class="top"><span>👤 ${S.name}</span><span id="lv">${'❤️'.repeat(S.lives)}${'🖤'.repeat(3-S.lives)}</span><span>⭐ ${S.score}</span></div>`;

function start(){
 document.body.style.backgroundImage=`url(${A.bg})`;
 app.innerHTML=`<div class="stage"><div class="side"><img class="mas big float" src="${A.happy}" alt=""></div><div class="card"><img class="logo" src="${A.logo}" alt="Pizzeria Pecahan"><p>Bantu Chef Piko membagi pizza dengan adil!</p><input id="nm" type="text" maxlength="20" placeholder="Tulis namamu..." value="${S.name}"><br><br><button class="btn big" id="go">Mulai Bermain ▶</button><p class="small"><label><input type="checkbox" id="snd" ${S.mute?'':'checked'}> Suara</label></p></div></div>`;
 $('#snd').onchange=e=>S.mute=!e.target.checked;
 $('#go').onclick=()=>{S.name=$('#nm').value.trim()||'Teman';sound(true);menu()}}
let AC;function sound(ok){if(S.mute)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const t=AC.currentTime;(ok?[660,880]:[300,200]).forEach((f,i)=>{const o=AC.createOscillator(),g=AC.createGain();o.type=ok?'triangle':'sawtooth';o.frequency.value=f;g.gain.setValueAtTime(.15,t+i*.12);g.gain.exponentialRampToValueAtTime(.001,t+i*.12+.2);o.connect(g);g.connect(AC.destination);o.start(t+i*.12);o.stop(t+i*.12+.2)})}catch(e){}}
function menu(){
 app.innerHTML=hud()+`<div class="card row">${img('happy')}<div class="bubble">Halo, Chef ${S.name}! Pilih misi pizza hari ini. Selesaikan misi sebelumnya untuk membuka berikutnya.</div></div>`+
 '<div class="grid3">'+LV.map((l,i)=>{const st=S.prog[i]||0,lock=i>0&&!S.prog[i-1];
  return `<button class="lvl ${lock?'lock':''}" data-i="${i}"><span class="n">${i+1}</span><span><b>${l.t}</b><br><span class="small">${l.d}</span><br><span class="stars">${'★'.repeat(st)}${'☆'.repeat(3-st)}</span></span></button>`}).join('')+'</div>'+
 `<button class="btn alt" id="bk">← Ganti Pemain</button>`;
 document.querySelectorAll('.lvl').forEach(b=>b.onclick=()=>{if(!b.classList.contains('lock'))begin(+b.dataset.i)});$('#bk').onclick=start}
function begin(i){S.lvl=i;S.q=0;S.lives=3;S.wrong=0;
 app.innerHTML=hud()+`<div class="card wide">${img('happy')}<h2>Misi ${i+1}: ${LV[i].t}</h2><div class="bubble">💡 ${LV[i].tip}</div><br><button class="btn" id="n">Siap!</button></div>`;$('#n').onclick=ask}
function ask(){
 if(S.q>=TOTAL)return done(true);
 const L=S.lvl;let body='',ans;S.tries=0;
 const head=`${hud()}<div class="stage"><div class="side"><div id="mc">${img('happy','mas big')}</div><div class="bubble" id="bb">${R(['Ayo semangat!','Teliti ya, Chef!','Kamu pasti bisa!'])}</div></div><div class="main"><div class="top"><span>Soal ${S.q+1} / ${TOTAL}</span><span>${LV[L].t}</span></div><div class="prog"><b style="width:${S.q/TOTAL*100}%"></b></div><div class="card">`;
 if(L==0){
  const n=R([2,3,4,5,6,8]),k=1+Math.floor(Math.random()*(n-1));ans=k+'/'+n;S.t={n,k};
  const set=new Set([ans]);const dif=(kk,nn)=>kk*n!=k*nn;while(set.size<4){const nn=R([2,3,4,5,6,8]),kk=1+Math.floor(Math.random()*(nn-1));if(dif(kk,nn))set.add(kk+'/'+nn);if(set.size<4&&dif(n-k,n))set.add((n-k)+'/'+n);if(set.size<4&&k+1<n)set.add((k+1)+'/'+n)}
  const o=sh([...set].slice(0,4).concat(ans)).filter((x,i,a)=>a.indexOf(x)==i).slice(0,4);if(!o.includes(ans))o[0]=ans;
  body=`<div class="split"><div><h2>Berapa bagian pizza yang berwarna?</h2>${pizza(n,Array.from({length:k},(_,i)=>i),false)}</div><div class="opts">${sh(o).map(x=>{const[a,b]=x.split('/');return `<button class="opt" data-a="${x}">${fr(a,b)}</button>`}).join('')}</div></div>`;
 }else if(L==1){
  const n=R([2,3,4,5,6,8]),k=1+Math.floor(Math.random()*(n-1));S.t={n,k,sel:[]};
  body=`<div class="split"><div id="pz">${pizza(n,[],true)}</div><div><h2>Warnai pizza sebanyak</h2>${fr(k,n)}<p><button class="btn" id="chk">Periksa ✔</button></p></div></div>`;
 }else{
  const P=[[1,4,3,4],[2,5,4,5],[3,8,5,8],[1,2,1,3],[2,3,2,5],[1,2,2,4],[3,6,1,2],[2,4,3,6],[5,6,1,6],[1,3,1,6],[3,4,3,8],[2,3,4,6],[1,5,1,4]];
  let [a,b,c,d]=R(P);if(Math.random()<.5)[a,b,c,d]=[c,d,a,b];
  const cmp=a*d-c*b;ans=cmp>0?'>':cmp<0?'<':'=';S.t={a,b,c,d};
  body=`<h2>Pilih tanda yang tepat</h2><div class="split"><div class="row" style="gap:14px"><div style="flex:1">${fr(a,b)}${bar(a,b)}</div><b style="font-size:2rem">?</b><div style="flex:1">${fr(c,d)}${bar(c,d)}</div></div><div class="row">${['<','=','>'].map(x=>`<button class="btn opt" style="min-width:80px;font-size:2rem;min-height:64px" data-a="${x}">${x}</button>`).join('')}</div></div>`;
 }
 window._a=ans;app.innerHTML=head+body+`<div id="fb"></div></div></div></div>`;
 if(L!=1)document.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>judge(b.dataset.a==ans,b,explain(L,ans)));
 else{
  const pz=()=>{$('#pz').innerHTML=pizza(S.t.n,S.t.sel,true);bind()};
  const bind=()=>document.querySelectorAll('.sl').forEach(p=>p.onclick=()=>{const i=+p.dataset.i,s=S.t.sel;s.includes(i)?s.splice(s.indexOf(i),1):s.push(i);pz()});bind();
  $('#chk').onclick=()=>judge(S.t.sel.length==S.t.k,null,`Pecahan ${S.t.k}/${S.t.n} artinya ${S.t.k} dari ${S.t.n} irisan sama besar diwarnai.`)}}
function explain(L,ans){
 if(L==0){const[k,n]=ans.split('/');return `Ada ${k} irisan berwarna dari ${n} irisan sama besar, jadi pecahannya ${k}/${n}.`}
 const{a,b,c,d}=S.t;return a*d==c*b?`${a}/${b} dan ${c}/${d} sama besar (senilai).`:`${a}/${b} ${a*d>c*b?'lebih besar dari':'lebih kecil dari'} ${c}/${d}. Lihat panjang batang berwarna.`}
function hint(L,t){const T=S.t;
 if(L==0)return t<2?'Hitung dulu: ada berapa irisan pizza seluruhnya? Angka itu ditulis di bawah garis pecahan.':'Sekarang hitung irisan yang berwarna kuning. Angka itu ditulis di atas garis pecahan.';
 if(L==1){const c=T.sel.length;return c==0?'Kamu belum mewarnai irisan. Baca pecahannya, lalu ketuk irisan pizza.':c>T.k?'Irisan yang kamu warnai terlalu banyak. Hitung lagi, lalu samakan dengan angka di atas garis.':'Irisan yang kamu warnai masih kurang. Hitung lagi, lalu samakan dengan angka di atas garis.'}
 if(t<2)return 'Perhatikan kedua batang. Bagian kuning mana yang lebih panjang, atau apakah sama panjang?';
 if(T.b==T.d)return 'Kedua pizza dipotong sama banyak, jadi potongannya sama besar. Bandingkan banyaknya potongan yang diambil.';
 if(T.a==T.c)return 'Banyak potongan yang diambil sama. Coba bandingkan ukuran satu potongan: pizza yang dipotong lebih banyak punya potongan lebih besar atau lebih kecil?';
 return 'Lihat ujung batang kuning masing-masing. Apakah salah satunya melewati garis tengah atau berhenti di tempat yang sama?'}
function judge(ok,btn,why){
 if(ok){
  document.querySelectorAll('.opt,#chk').forEach(b=>b.disabled=true);
  document.querySelectorAll('.sl').forEach(p=>p.onclick=null);
  S.score+=S.tries?10:20;sound(true);
  $('#mc').innerHTML=img('happy','mas big jump');$('#bb').textContent=R(['Mantap sekali!','Pizzanya sempurna!','Kamu pintar!']);
  if(btn)btn.classList.add('ok');
  $('#fb').innerHTML=`<br><div class="fb ok">🎉 Hebat! Benar! ${why}</div><br><button class="btn" id="nx">Soal Berikutnya ▶</button>`;
  $('#nx').onclick=()=>{S.q++;ask()};return}
 S.lives--;S.wrong++;S.tries++;sound(false);
 $('#mc').innerHTML=img('sad','mas big');$('#lv').innerHTML='❤️'.repeat(S.lives)+'🖤'.repeat(3-S.lives);
 if(btn){btn.classList.add('no');btn.disabled=true}
 if(S.lives<=0){
  document.querySelectorAll('.opt,#chk').forEach(b=>b.disabled=true);
  document.querySelectorAll('.sl').forEach(p=>p.onclick=null);
  $('#bb').textContent='Tidak apa-apa, kita coba lagi ya!';
  $('#fb').innerHTML=`<br><div class="fb no">Nyawamu habis. Baca petunjuknya lagi, lalu ulangi misi ini.</div><br><button class="btn" id="nx">Lanjut</button>`;
  $('#nx').onclick=()=>done(false);return}
 $('#bb').textContent=R(['Belum tepat. Coba lagi ya!','Tenang, pikirkan pelan-pelan.']);
 $('#fb').innerHTML=`<br><div class="fb no">🤔 Belum tepat, coba lagi! <br>💡 Petunjuk: ${hint(S.lvl,S.tries)}</div>`}
function done(win){
 const st=win?(S.wrong==0?3:S.wrong<=1?2:1):0;
 if(win){S.score+=st*30;S.prog[S.lvl]=Math.max(S.prog[S.lvl]||0,st);save()}
 app.innerHTML=`${hud()}<div class="card wide">${img(win?'happy':'sad')}<h1>${win?'Misi Selesai!':'Ayo Coba Lagi!'}</h1>
 ${win?`<div class="stars" style="font-size:2.4rem">${'★'.repeat(st)}${'☆'.repeat(3-st)}</div><p>Pizza terbagi rata berkat kamu, Chef ${S.name}!</p>`:`<p>Jangan menyerah. Baca petunjuknya lalu coba lagi ya.</p>`}
 <div class="row"><button class="btn alt" id="rt">↻ Ulangi</button><button class="btn" id="mn">Peta Misi</button></div></div>`;
 $('#rt').onclick=()=>begin(S.lvl);$('#mn').onclick=menu}
start();
</script></body></html>
